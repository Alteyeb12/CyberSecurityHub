version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cyberinsight-db
    environment:
      SA_PASSWORD: "YourPassword@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - cyberinsight-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourPassword@123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ASP.NET Core Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberinsight-app
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CyberInsightDB;User Id=sa;Password=YourPassword@123;TrustServerCertificate=true;
      - Stripe__PublicKey=pk_test_your_key
      - Stripe__SecretKey=sk_test_your_key
      - Stripe__WebhookSecret=whsec_your_secret
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cyberinsight-network
    volumes:
      - .:/app
    command: dotnet CyberInsight.dll

networks:
  cyberinsight-network:
    driver: bridge

volumes:
  sqldata:
    driver: local
